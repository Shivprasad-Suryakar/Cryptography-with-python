name: Build and run Docker, upload output

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: myapp:latest

      - name: Run container and capture output
        run: |
          # Run the image and capture stdout+stderr to a file
          docker run --rm myapp:latest > app-output.txt 2>&1 || true

      - name: Upload program output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-output
          path: app-output.txt
